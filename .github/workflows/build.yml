name: Build SpectraS APK & Play Store AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Play Store Upload Keystore (if configured in Secrets)
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLAY_KEYSTORE_BASE64" ]; then
            echo "$PLAY_KEYSTORE_BASE64" | base64 --decode > app/play-upload.jks
            echo "PLAY_KEYSTORE_PATH=play-upload.jks" >> "$GITHUB_ENV"
            echo "Using private Play Store upload keystore from GitHub Secrets."
          else
            echo "PLAY_KEYSTORE_BASE64 secret not set; using default project signing keystore."
          fi

      - name: Build Release APK & Play Store AAB
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon
          mkdir -p app/build/outputs/apk/release_named
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release_named/SpectraS-v5.0.apk
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/SpectraS-playstore.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraS-APK
          path: app/build/outputs/apk/release_named/SpectraS-v5.0.apk
          retention-days: 30

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpectraS-PlayStore-AAB
          path: app/build/outputs/bundle/release/SpectraS-playstore.aab
          retention-days: 30

      - name: Commit and Push APK to Repository Root
        run: |
          cp app/build/outputs/apk/release_named/SpectraS-v5.0.apk ./SpectraS-v5.0.apk
          git rm -f --ignore-unmatch app-debug.apk || true
          git config user.name "alisamilaytekin"
          git config user.email "alisamilaytekin@gmail.com"
          git add SpectraS-v5.0.apk
          if ! git diff --staged --quiet; then
            git commit -m "Update SpectraS v5.0 compiled APK [skip ci]"
            git push origin main
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v5.0 -y --cleanup-tag || true
          gh release create v5.0 \
            app/build/outputs/apk/release_named/SpectraS-v5.0.apk \
            app/build/outputs/bundle/release/SpectraS-playstore.aab \
            --latest \
            --title "SpectraS v5.0 (Live HSL & Infrared RAW Camera + Photo Editor Studio)" \
            --notes "Play Store Edition (targetSdk 35, AAB + APK): Full-width floating HUD, Ghost Mode, Live 8-Band HSL Color Histogram Mixer, 360° Point Color Pipette, Real-Time R↔B Channel Swap, 8 Built-in Infrared & Cinema Presets, Flash & Front Camera, Bilingual EN/TR, and Full Live Gallery Photo Editor Studio." || true

      - name: Keep Only Latest 3 Releases and Workflow Runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[3:] | .[] | "\(.id) \(.tag_name)"' | \
          while read -r rel_id tag_name; do
            [ -z "$rel_id" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/releases/$rel_id" || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag_name" || true
          done

          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.created_at) | reverse | .[3:] | .[].id' | \
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" || true
          done
