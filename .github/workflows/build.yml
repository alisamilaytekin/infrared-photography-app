name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Commit and Push APK to Repository Root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          git config user.name "alisamilaytekin"
          git config user.email "alisamilaytekin@gmail.com"
          git add app-debug.apk
          if ! git diff --staged --quiet; then
            git commit -m "Update v4.6 compiled APK [skip ci]"
            git push origin main
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v4.6 -y --cleanup-tag || true
          gh release create v4.6 app/build/outputs/apk/debug/app-debug.apk \
            --title "CameraS v4.6 (Sade ve Kolay Anlaşılır Arayüz & Geniş Vizör)" \
            --notes "Kullanıcı dostu, sadeleştirilmiş ve ferah yeni arayüz tasarımı. Tek satırlık üst bar (OTO/PRO geçişi, telemetri, çözünürlük), derli toplu 3 sekmeli alt panel (WB, Renk, Işık), odaklı kaydırıcılar, bağımsız Preset penceresi ve vizörü kapatmayan ferah ekran yerleşimi." || true

      - name: Keep Only Latest 3 Releases and Workflow Runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[3:] | .[] | "\(.id) \(.tag_name)"' | \
          while read -r rel_id tag_name; do
            [ -z "$rel_id" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/releases/$rel_id" || true
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag_name" || true
          done

          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.created_at) | reverse | .[3:] | .[].id' | \
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" || true
          done
